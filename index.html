<script>/* CLASS QUEST 2.0 — source-backed lesson data.

const LABS = {
  version: 1,
  briefing: "A small veterinary clinic wants a system to manage its day-to-day work. When a pet is brought in for the first time, the clinic records the pet's name, species, breed, and date of birth, along with the owner's name, home address, and phone number. Owners call to book appointments; each appointment has a date, a time, and a stated reason for the visit, and is assigned to one of the clinic's veterinarians. At the visit the vet examines the pet, records its current weight, and may give one or more treatments, each with a description and a cost. After the visit the clinic issues an invoice listing the treatments given, which the owner pays in full or in part. Dr. Ramirez, the senior vet, also wants to see which appointments were cancelled and why.",
  candidates: [
    {id:'pet',name:'Pet',glyph:'P',keep:true,kind:'A category',who:'I am a pet registered with the clinic.',know:'My name, species, breed, date of birth, current weight.',do:'Be registered, be examined, be weighed.',collab:'Owner, Appointment, Visit',why:'The clinic needs a separate record for each pet, with several facts and actions. Pet is the category. Bella would be one particular pet.',evidence:'“records the pet’s name, species, breed, and date of birth”'},
    {id:'address',name:'Address',glyph:'A',keep:false,kind:'An attribute',who:'I am an owner’s home address.',know:'Nothing on my own. I am one line of text belonging to an Owner.',do:'Be updated as part of the Owner’s contact details.',why:'In this exercise, Address is information about an Owner. Keep those facts inside Owner. A noun is a candidate for a class, but it does not automatically earn a box.',evidence:'“the owner’s name, home address, and phone number”'},
    {id:'appointment',name:'Appointment',glyph:'A',keep:true,kind:'A category',who:'I am a booking for a pet to see a veterinarian.',know:'My date, my time, the reason for the visit, whether I was kept or cancelled, and why.',do:'Be booked, be cancelled, be rescheduled.',collab:'Owner, Pet, Veterinarian',why:'A booking has its own information and actions. Keep it even when it is cancelled, so the clinic can answer Dr. Ramirez’s question.',evidence:'“which appointments were cancelled and why”'},
    {id:'system',name:'The System',glyph:'S',keep:false,kind:'The software boundary',who:'I am the software you are building.',know:'I am the software you are building; the other records are what I remember.',do:'Manage the clinic’s records.',why:'For this domain model, The System is the software doing the remembering. Its box would not describe a business thing that it needs to remember.',evidence:'“wants a system to manage its day-to-day work”'},
    {id:'owner',name:'Owner',glyph:'O',keep:true,kind:'A category',who:'I am a person who owns a pet registered with the clinic.',know:'My name, my home address, my phone number.',do:'Book an appointment, pay an invoice, update my contact details.',collab:'Pet, Appointment, Invoice',why:'The clinic stores contact details for each owner. Owners also book appointments and pay invoices, so this class supports stated work.',evidence:'“Owners call to book appointments”'},
    {id:'weight',name:'Weight',glyph:'W',keep:false,kind:'An attribute',who:'I am a pet’s current weight.',know:'A number and a unit. That is all.',do:'Be recorded as a fact about a Pet.',why:'In the original clinic model, the current weight is an attribute of Pet. A history of dated measurements would need separate records. The business requirement decides.',evidence:'“records its current weight”',changedWho:'I am one dated weight measurement for a pet.',changedKnow:'A measured weight, its unit, its date, and the pet it belongs to.',changedDo:'Be recorded as one point in a pet’s weight history.',changedWhy:'The new rule asks for weight over time. Each measurement now needs its own date and pet link. Weight earns its own class.'},
    {id:'vet',name:'Veterinarian',glyph:'V',keep:true,kind:'A category',who:'I am a veterinarian working at the clinic.',know:'My name and my licence number.',do:'Examine a pet, record a weight, give a treatment.',collab:'Appointment, Pet, Visit, Treatment',why:'The system must assign appointments to a veterinarian. Veterinarian names a category, so the same class works for every vet.',evidence:'“assigned to one of the clinic’s veterinarians”'},
    {id:'ramirez',name:'Dr. Ramirez',glyph:'R',keep:false,kind:'An object',who:'I am Dr. Ramirez, one particular veterinarian.',know:'My name is Ramirez and I hold licence 44182.',do:'Examine pets and give treatments, just as other veterinarians do.',why:'Dr. Ramirez is an object: one instance of Veterinarian. A class is the template for all veterinarians, so use a common noun for its name.',evidence:'“Dr. Ramirez, the senior vet”'},
    {id:'invoice',name:'Invoice',glyph:'I',keep:true,kind:'A category',who:'I am a bill issued after a visit.',know:'My number, my date, my total, and how much has been paid.',do:'Be issued, be paid in full, be paid in part.',collab:'Owner, Treatment, Visit',why:'Each bill has its own amount, payment information, and actions. Tracking the amount paid lets the clinic handle a partial payment.',evidence:'“the owner pays in full or in part”'},
    {id:'client',name:'Client',glyph:'C',keep:false,kind:'A duplicate name',who:'I am the person this clinic also calls an Owner.',know:'The same things the Owner knows. We are the same.',do:'Book appointments and pay invoices, just like Owner.',why:'Client and Owner name the same role in this scenario. Use one consistent class name so the same person is not modeled twice.',evidence:'The brief names Owner for the person booking and paying.'},
    {id:'treatment',name:'Treatment',glyph:'T',keep:true,kind:'A category',who:'I am a treatment given during a visit.',know:'My description and my cost.',do:'Be given during a visit, be added to an invoice.',collab:'Visit, Veterinarian, Invoice',why:'The clinic records which treatments were given and lists them on an invoice. Each treatment carries its own description and cost.',evidence:'“one or more treatments, each with a description and a cost”'},

    {id:'visit',name:'Visit',glyph:'V',keep:true,kind:'A category',who:'I am the visit that actually happened.',know:'The date I happened, the weight recorded, the vet’s notes.',do:'Record treatments given, produce an invoice.',collab:'Pet, Veterinarian, Treatment, Invoice',why:'Appointment is the booking; Visit is what actually happened. A cancelled appointment can exist without a visit. Keeping these separate preserves that distinction and supports the cancellation question.',evidence:'“At the visit the vet examines the pet” versus “appointments were cancelled”'},
    {id:'phone',name:'Phone Number',glyph:'#',keep:false,kind:'An attribute',who:'I am an owner’s phone number.',know:'Nothing. I am a string of digits attached to an Owner.',do:'Be updated as part of the Owner’s contact details.',why:'For this clinic, the phone number is one fact about an Owner. Store it in Owner’s attributes compartment.',evidence:'“the owner’s name, home address, and phone number”'}
  ],
  types:['Class named after a person','Attribute drawn as a class','Multiplicity wrong','Generalization where association belongs','Aggregation where association belongs','Duplicate class under a second name','Class nothing calls for','No fault here'],
  faults: [
    {id:'f1',type:0,target:'Dr. Ramirez',fixes:['Rename the class to Veterinarian','Add another class for each new vet','Delete every veterinarian from the model'],answer:0,wrong:['','That would give every individual a new class. One Veterinarian class describes them all.','Appointments must still be assigned to veterinarians. Keep the category.']},

    {id:'f3',type:2,target:'Owner–Pet multiplicities',fixes:['Put 1..* beside Owner; leave 1 beside Pet','Leave exactly 1 at both ends','Keep 1 beside Owner; put 1..* beside Pet'],answer:2,wrong:['That would allow several owners for one pet. This is the later rule change, not the original rule.','This would restrict an owner to exactly one pet. The supplied key allows one or more.','']},
    {id:'f4',type:3,target:'Appointment–Treatment',fixes:['Plain association: results in; 1 at Appointment, 0..* at Treatment','Hollow diamond at Appointment','Keep the triangle pointing at Treatment'],answer:0,wrong:['','This exercise’s key calls for an association between the event and its treatments.','The triangle says an Appointment is a kind of Treatment. That is false.']},
    {id:'f5',type:4,target:'Pet–Appointment',fixes:['Generalization, with its triangle at Pet','Plain association: is booked for; keep the numbers','Move the diamond to Appointment'],answer:1,wrong:['An Appointment is not a kind of Pet.','','Moving the diamond still makes a part–whole claim. A pet and its appointment are associated.']},
    {id:'f6',type:5,target:'Client',fixes:['Connect Client to Owner and keep both','Rename Client to Dr. Ramirez','Delete Client; use Owner consistently'],answer:2,wrong:['A line does not remove the duplicated role. Client and Owner mean the same thing here.','Dr. Ramirez is one particular veterinarian, not this class.','']},
    {id:'f7',type:6,target:'Supplier',fixes:['Delete Supplier because no stated requirement needs it','Keep it in case the clinic needs purchasing later','Rename Supplier to Invoice'],answer:0,wrong:['','A future possibility is not a stated requirement. Model the scope you have.','Renaming an unrelated class does not justify it. Invoice already exists.']}
  ],
  explain: {
    1:{q:'The clinic opens a second branch. Why does Clinic become a class now?',choices:['Because the clinic got bigger.','Because the system must now tell one branch from another, and store facts about each.','Because every business needs a Clinic class.'],answer:1,feedback:['Size is not the test. A single very large clinic still would not need the box under these requirements.','Right. The new requirement calls for separate branch records and facts about each.','Nothing is a class by default. A box is earned by a requirement.']},
    2:{q:'Why did the number beside Owner have to change?',choices:['Because there are more owners in the world now.','Because the rule now lets one pet be linked to more than one owner.','Because the number beside Pet changed, so its partner must match.'],answer:1,feedback:['How many owners exist is irrelevant. Multiplicity describes one relationship, not the size of a table.','Exactly. The number is a business rule written in shorthand. Change the rule and the number must follow.','The two ends are set independently. Each answers a different question, and they do not have to agree.']}
  }
};

 billing:'“Bills for” is a plain association. The supplied exercise assumes one invoice for each billed Treatment and at least one Treatment for each Invoice.',
 'billing-numbers':'The 1 beside Invoice means one invoice for each billed treatment. The 1..* beside Treatment means one or more treatments per invoice. This is an assumption in the supplied repair key.',
 receives:'“Receives” is a plain association between Owner and Invoice. This is correct in the supplied exercise.',
 'receives-numbers':'The 1 beside Owner means one billing owner for each invoice. The 0..* beside Invoice allows an owner to have no invoices or many. Joint ownership changes the Pet link only.'
 })[id]||'Read the selected claim, then choose a diagnosis. The field guide has the notation rules.';}
function diagramSVG(){

 const edge=(id,d,label,x,y,extra='')=>`<g id="edge-${id}" data-inspect="${id}" role="button" tabindex="0" aria-label="Inspect ${boardLabel(id)}"><path class="edge" id="path-${id}" d="${d}"/><path class="edge-hit" d="${d}"/>${extra}<text id="label-${id}" class="edge-label" x="${x}" y="${y}" text-anchor="middle">${label}</text></g>`;
 const num=(id,x,y,text,part)=>`<g data-inspect="${id}" role="button" tabindex="0" aria-label="Inspect ${boardLabel(id)}" id="num-${part}"><rect class="num-bg" x="${x-23}" y="${y-22}" width="46" height="34" rx="6" fill="transparent"/><text class="multiplicity" id="value-${part}" x="${x}" y="${y}" text-anchor="middle">${text}</text></g>`;
 return `<svg class="uml" role="group" viewBox="0 0 970 875" xmlns="http://www.w3.org/2000/svg" aria-labelledby="board-svg-title board-svg-desc"><title id="board-svg-title">Veterinary clinic class diagram repair board</title><desc id="board-svg-desc">Use Tab and Enter or Space to inspect class boxes, relationships, or numbers. The inspection list offers the same choices without panning.</desc>
 ${edge('receives','M65 184H28V723H65','',0,0)}<text class="edge-label" x="17" y="463" transform="rotate(-90 17 463)" text-anchor="middle" pointer-events="none">receives</text>
 ${edge('ownership','M285 134H385','owns',335,118)}

 ${edge('f5','M495 255V315','',558,288,'<path id="booking-diamond" d="M495 255L503 266L495 277L487 266Z" fill="white" stroke="#436a80" stroke-width="2"/>')}
 ${edge('conducts','M825 255V285H652V424H605','conducts',734,275)}
 ${edge('f4','M495 540V610','',556,580,'<path id="treatment-triangle" d="M495 610L485 592H505Z" fill="white" stroke="#436a80" stroke-width="2"/>')}
 ${edge('billing','M285 726H385','bills for',335,708)}
 ${box('owner',65,20,220,235,'Owner',['− name','− address','− phone'],['bookAppointment()','payInvoice()'])}
 ${box('pet',385,20,220,235,'Pet',['− name','− species','− breed','− dateOfBirth','− weight'],['beExamined()'])}

 ${box('appointment',385,315,220,225,'Appointment',['− date','− time','− reason','− status'],['cancel()','reschedule()'])}
 ${box('f6',710,315,230,185,'Client',['− name','− phone'],[])}
 ${box('invoice',65,610,220,225,'Invoice',['− invoiceNumber','− date','− totalAmount','− amountPaid'],['issue()','recordPayment()'])}
 ${box('treatment',385,610,220,205,'Treatment',['− description','− cost'],['recordTreatment()'])}
 ${box('f7',710,610,230,185,'Supplier',['− companyName','− accountNumber'],['placeOrder()'])}
 ${num('f3',302,158,'1','owner-end')}${num('f3',367,158,'1','pet-end')}

 <g id="treatment-numbers">${num('f4',470,564,'1','app-treatment')}${num('f4',464,603,'0..*','treatment-app')}</g>

let diagramNode=null;
function mountDiagram(){const host=document.getElementById('uml-host');if(!host)return;if(!diagramNode){const temp=document.createElement('div');temp.innerHTML=diagramSVG();diagramNode=temp.firstElementChild;}host.replaceChildren(diagramNode);syncDiagram();}
function syncDiagram(){if(!diagramNode)return;const $=id=>diagramNode.querySelector('#'+id),done=id=>S.m2.fixed.includes(id),hide=(id,v)=>{$(id).style.display=v?'none':'';};
 $('name-f1').textContent=done('f1')?'Veterinarian':'Dr. Ramirez';$('box-f1').setAttribute('aria-label','Inspect '+(done('f1')?'Veterinarian':'Dr. Ramirez'));
 ['f2','f6','f7'].forEach(id=>hide('box-'+id,done(id)));hide('edge-address-line',done('f2'));
 $('attrs-owner').innerHTML=(done('f2')?['− name','− street','− city','− postcode','− phone']:['− name','− address','− phone']).map((t,i)=>`<text x="78" y="${84+21*i}">${t}</text>`).join('');
 $('value-pet-end').textContent=done('f3')?'1..*':'1';$('value-owner-end').textContent=S.m2.joint?'1..*':'1';
 hide('booking-diamond',done('f5'));$('label-f5').textContent=done('f5')?'is booked for':'';
 hide('treatment-triangle',done('f4'));hide('treatment-numbers',!done('f4'));$('label-f4').textContent=done('f4')?'results in':'';
 diagramNode.querySelectorAll('.class-target').forEach(el=>{el.classList.toggle('repaired',done(el.dataset.inspect)||(el.dataset.inspect==='owner'&&done('f2')));el.classList.toggle('selected',UI.inspect===el.dataset.inspect);});
}
function relationshipMini(owner='1',pet='1..*'){return `<svg class="relationship-mini relationship-desktop" viewBox="0 0 650 125" role="img" aria-label="Owner owns Pet. ${esc(owner)} at Owner; ${esc(pet)} at Pet."><rect x="15" y="25" width="160" height="65" rx="10" fill="#e3f4ed" stroke="#72ad97"/><rect x="475" y="25" width="160" height="65" rx="10" fill="#e5eff5" stroke="#7f9db1"/><text x="95" y="65" text-anchor="middle" font-weight="750">Owner</text><text x="555" y="65" text-anchor="middle" font-weight="750">Pet</text><path d="M175 58H475" stroke="#365f74" stroke-width="2"/><text x="325" y="43" text-anchor="middle">owns</text><text x="207" y="86" text-anchor="middle" font-weight="750">${esc(owner)}</text><text x="443" y="86" text-anchor="middle" font-weight="750">${esc(pet)}</text></svg>`+compactRelationship(owner,pet);}

const FIELD_TABS=[['basics','Start here'],['boxes','Class boxes'],['lines','Relationships'],['numbers','Multiplicity'],['crc','CRC & checks'],['lecture','More from the lecture'],['sources','Sources']];
function lineExample(kind){const settings={general:['Dog','Pet','is a kind of'],aggregate:['Wheel','Vehicle','is part of'],associate:['Owner','Pet','owns']}[kind];return `<svg class="relationship-mini relationship-desktop" viewBox="0 0 650 110" role="img" aria-label="${settings.join(' · ')}"><rect x="10" y="25" width="155" height="60" rx="8" fill="#e9f3f0" stroke="#92b3a8"/><rect x="485" y="25" width="155" height="60" rx="8" fill="#e7f0f6" stroke="#92aab9"/><text x="87" y="61" text-anchor="middle">${settings[0]}</text><text x="562" y="61" text-anchor="middle">${settings[1]}</text><path d="M165 55H485" stroke="#365e73" stroke-width="2"/><text x="325" y="37" text-anchor="middle">${settings[2]}</text>${kind==='general'?'<path d="M485 55L463 43V67Z" fill="white" stroke="#365e73" stroke-width="2"/>':kind==='aggregate'?'<path d="M485 55L470 45L455 55L470 65Z" fill="white" stroke="#365e73" stroke-width="2"/>':''}</svg>`+compactLine(kind);}
function guideContent(tab){return ({
 basics:`<div class="eyebrow">A blueprint for information</div><h3>What must the clinic remember?</h3><p>Before writing software, an analyst decides which things need records. A <strong>class diagram</strong> shows those categories as boxes and connects them with lines.</p><div class="guide-grid"><div class="guide-tile"><h3>Class = a blank form</h3><p><span class="term-tag">Pet</span> is a template with spaces for a name, species, breed, and birth date.</p></div><div class="guide-tile"><h3>Object = one filled form</h3><p><strong>Bella, a beagle, born in 2021</strong> is one particular pet. Bella is an object in the Pet class.</p></div></div><div class="plain-callout"><strong>Your job:</strong> decide which words deserve a form of their own. Then check whether the diagram’s lines tell the truth.</div><button class="primary" data-action="learn-start">Show me the demonstrations →</button><h3>How to play</h3><p>Start with the three demonstrations. In Mission 1, meet one candidate at a time and use its clues to decide. In Mission 2, follow one small clue, choose what is wrong, and repair it. Use a hint whenever you want. Wrong guesses do not remove XP.</p><button class="primary" data-action="guide-tab" data-tab="boxes">Next: read a class box →</button>`,
 boxes:`<div class="eyebrow">Lecture slides 7–16</div><h3>Three compartments. Three jobs.</h3><div class="guide-grid"><div class="bonus-box" style="width:100%;margin:0"><h3>Appointment</h3><div class="bonus-compartment"><strong>ATTRIBUTES · WHAT IT KNOWS</strong>− date<br>− time<br>− reason<br>− status</div><div class="bonus-compartment"><strong>OPERATIONS · WHAT IT CAN DO</strong>cancel()<br>reschedule()</div></div><div><p>The <strong>name</strong> goes at the top. Use a category such as Appointment.</p><p><strong>Attributes</strong> are remembered facts. They go in the middle.</p><p><strong>Operations</strong> are actions. Here they end in parentheses and go at the bottom.</p><p>Methods implement those actions in software. At this stage, you are modeling what the system needs.</p></div></div><h3>Recognize the visibility symbols</h3><table><thead><tr><th>Symbol</th><th>Meaning in this course</th></tr></thead><tbody><tr><td><strong>+</strong> public</td><td>Other objects can access the attribute.</td></tr><tr><td><strong>#</strong> protected</td><td>Access is available within the class and its subclasses.</td></tr><tr><td><strong>−</strong> private</td><td>Hidden from other classes. The lecture uses private as the usual attribute default.</td></tr></tbody></table><button class="primary" data-action="guide-tab" data-tab="lines">Next: read the lines →</button>`,
 lines:`<div class="eyebrow">Lecture slides 17–23</div><h3>Say the claim aloud</h3><p>This module uses exactly three relationship types.</p><h3>Generalization: “is a kind of”</h3>${lineExample('general')}<p>A Dog is a kind of Pet. The <strong>hollow triangle points at the more general class</strong>, Pet. A subclass inherits the attributes and operations of its superclass.</p><h3>Aggregation: “is part of”</h3>${lineExample('aggregate')}<p>A Wheel is part of a Vehicle. The <strong>hollow diamond sits at the whole end</strong>, Vehicle.</p><h3>Association: another business link</h3>${lineExample('associate')}<p>An Owner owns a Pet. An Owner is neither a kind of Pet nor a part of one. Use a <strong>plain line with a verb phrase</strong>.</p><div class="plain-callout">A small direction indicator beside an association label in the lecture is not the hollow generalization triangle at the end of a line. This game uses plain association labels to keep the distinction clear.</div><button class="primary" data-action="guide-tab" data-tab="numbers">Next: read the numbers →</button>`,
 numbers:`<div class="eyebrow">Lecture slides 21–23</div><h3>Read from one end toward the other</h3><p><strong>The number beside a class counts THAT class for ONE object at the opposite end.</strong></p>${relationshipMini('1','1..*')}<div class="guide-grid"><div class="guide-tile"><h3>Start with one Owner</h3><p>Look across to the Pet end. <strong>1..*</strong> means that owner has one or more pets in the supplied baseline key.</p></div><div class="guide-tile"><h3>Start with one Pet</h3><p>Look across to the Owner end. <strong>1</strong> means that pet has exactly one owner under the original rule.</p></div></div><table><thead><tr><th>Symbol</th><th>Read it as</th></tr></thead><tbody><tr><td>1</td><td>Exactly one</td></tr><tr><td>0..1</td><td>Zero or one</td></tr><tr><td>1..*</td><td>One or more</td></tr><tr><td>0..*</td><td>Any number, including none</td></tr></tbody></table><p><strong>The two ends are independent.</strong> Equal numbers are not required. The numbers encode business rules, not the number of records currently stored.</p><details><summary>The Wheel–Vehicle example</summary><p>Slide 21 puts <strong>1..*</strong> beside Wheel and <strong>1</strong> beside Vehicle. For one vehicle, one or more wheels. For one wheel, exactly one vehicle in that example.</p></details><button class="primary" data-action="guide-tab" data-tab="crc">Next: justify each box →</button>`,
 crc:`<div class="eyebrow">Lecture slides 25–32</div><h3>Interview the candidates</h3><p>A <strong>CRC card</strong> records a <strong>Class</strong>, its <strong>Responsibilities</strong>, and its <strong>Collaborators</strong>. Responsibilities cover what it knows and can do. Collaborators are other classes it works with.</p><div class="guide-tile"><h3>Ask these three questions</h3><ol><li>Who or what are you?</li><li>What do you know?</li><li>What can you do?</li></ol><p>Then ask which other classes help it do that work. Your notebook records example collaborators for the accepted classes.</p></div><h3>Finding candidates</h3><p>Read the business description. Nouns suggest classes, verbs suggest operations, and descriptive words can suggest attributes. These are clues, not automatic answers.</p><p>A noun may instead be an attribute, a duplicate name, an individual object, or something outside the scope.</p><h3>Traceability: give each box a reason</h3><p>Link every class to at least one <strong>use case</strong>: a piece of work the system must support. A plausible box with no stated purpose does not belong in the analysis model.</p><h3>Walk through a real task</h3><p>Pretend to be the classes while acting out a booking or a visit. Check who remembers each fact and who performs each action. The lecture calls this <strong>role playing</strong>. In a walkthrough, analysts explain and justify the model with developers and users.</p><button class="primary" data-action="close">Ready to investigate →</button>`,
 lecture:`<div class="eyebrow">The wider chapter</div><h3>Where structural modeling fits</h3><p>The lecture places the structural view alongside the functional view and the behavioral view. Functional modeling describes required work. Structural modeling describes the things and relationships that support it. Behavioral modeling describes behavior over time.</p><h3>A model develops through revisions</h3><p>Object-oriented development is use-case driven, architecture-centric, and iterative and incremental. In plain language: start from required tasks, organize the system coherently, and improve it through repeated small passes.</p><p>During <strong>analysis</strong>, a conceptual model describes the business information. During <strong>design</strong>, the model gains details about how software and databases will organize it. These missions focus on analysis.</p><h3>Objects have state</h3><p>An object’s <strong>state</strong> is the current value of its attributes and relationships. An appointment’s status can change from booked to cancelled. The Appointment class remains the same.</p><h3>Methods and messages</h3><p>A <strong>method</strong> implements an object’s behavior. A <strong>message</strong> asks an object to perform an action. Slide 10 shows a create message triggering a Patient creation method.</p><h3>Other ways to find classes</h3><p>Besides textual analysis, analysts brainstorm candidates and reuse <strong>patterns</strong>: groups of collaborating classes that repeatedly solve similar problems. Slide 26 gives a transaction, line item, item, location, and participant pattern.</p><h3>How the lecture’s examples connect</h3><ul><li>Animal, Bird, Fish, Cardinal, and Trout illustrate inheritance.</li><li>Wheel and Vehicle illustrate aggregation and multiplicity.</li><li>Invoice and Purchase Order, Pilot and Aircraft, and Spare Tire and Trunk illustrate associations.</li><li>The Patient CRC card and library class diagram illustrate documenting responsibilities and combining classes.</li></ul><p class="source-note">These examples explain the chapter. The two assessed missions use only the veterinary-clinic keys supplied in the module brief.</p>`,
 sources:`<h3>Built from both files in the supplied folder</h3><div class="notebook-entry"><strong>ISM301_Module_Request_Structural_Modeling.docx</strong><p>Scenario, 14-candidate roster, CRC answers, seven required fault corrections, rule changes, explanation questions, and mission requirements.</p></div><div class="notebook-entry"><strong>ISM301_Ch5_Handout.pptx</strong><p>All 33 slides reviewed. Class/object concepts: 5–10. Class boxes: 13–16. Relationships and multiplicity: 17–23. Identification, CRC, and validation: 25–32.</p></div><p>Course: ISM 301 Systems and Process Analysis, Chapter 5: Structural Modeling. Module brief requested by Syed Shuva, Ph.D., UNC Greensboro.</p><p>Accompanying textbook: Dennis, Wixom, and Tegarden, <em>Systems Analysis and Design: An Object-Oriented Approach with UML</em>, 6th edition.</p><h3>Choices that keep the model clear</h3><ul><li>Only Clinic and Weight change in the expanded scenario: 2 changed, 12 unchanged, 9 accepted. The brief’s “ten unchanged” is a counting typo.</li><li>The optional operation-placement fault is a separate bonus. The main diagram always starts with seven required faults.</li><li>The repair diagram follows the supplied excerpt. Visit is a valid class but is not drawn in that excerpt. The complete production model would need further detail, including cancellation reasons and the Visit relationships.</li><li>The supplied key sets the multiplicities. The briefing alone does not fully specify every minimum or maximum.</li></ul><p>Address, Clinic, and Weight decisions are specific to this exercise’s scope. A different requirement can justify a different model.</p><p class="source-note">The tutor gives scripted, source-grounded guidance. It does not connect to a live AI service. Clinic artwork was generated with OpenAI’s built-in image tool and is decorative.</p>`

function guidedFault(){return LABS.faults.find(f=>f.id===UI.inspect)||LABS.faults.find(f=>!S.m2.fixed.includes(f.id))||LABS.faults[6];}
function renderGuidedRepair(){const f=guidedFault(),r=REPAIR_LESSONS[f.id],fixed=S.m2.fixed.includes(f.id);return `<div class="guided-repair"><section class="panel focused-repair"><div class="panel-header"><div><span class="eyebrow">Clue ${LABS.faults.indexOf(f)+1} of 7</span><h2>${r.label}</h2></div><span class="pill">${S.m2.fixed.length} / 7 repaired</span></div><div class="remember-strip">${questIcon('pip')}<p><strong>A little help:</strong> ${r.remember}</p></div><div class="repair-visual ${UI.repairMotion===f.id?'repair-motion':''}"><span class="visual-state">${fixed?'AFTER YOUR REPAIR':'BEFORE YOUR REPAIR'}</span>${repairVisual(fixed,f.id)}${mobileRepairVisual(fixed,f.id)}</div>${fixed?`<div class="feedback"><strong>✓ You repaired the model.</strong><p>${MATH[f.id]}</p></div>${S.m2.step===2&&S.m2.fixed.length<7?'<button class="next-candidate" data-action="next-repair">Next small clue →</button>':''}`:!UI.diagnosed?`<div class="mission-microcue"><strong>1 · Look at the picture. 2 · Read Pip’s clue.</strong><p>Now choose the sentence that explains the problem. After that, we’ll fix it together.</p></div><h3>What looks wrong?</h3><div class="quiz-options diagnosis-options">${r.types.map((type,i)=>`<button class="option" data-action="guided-diagnose" data-fault="${f.id}" data-value="${type}">${r.plain[i]}</button>`).join('')}</div>${feedbackHTML()}`:`<div class="diagnosis-name"><small>THE UML NAME FOR IT</small><strong>${LABS.types[f.type]}</strong></div><div class="mission-microcue"><strong>You found the problem. Now change just that part.</strong><p>Choose one repair below. The picture will update, and Pip will explain why.</p></div><h3>Choose the repair.</h3><div class="quiz-options">${f.fixes.map((c,i)=>`<button class="option" data-action="repair" data-value="${i}">${c}</button>`).join('')}</div>${feedbackHTML()}`}</section>${tutor()}</div>`;}
function renderRepairMission(){const s=S.m2.step;if(s===1)return `<div class="mission-layout"><section class="panel">${renderGuess(2)}</section>${tutor()}</div>`;if(s===3)return `<div class="mission-layout"><section class="panel">${renderJoint()}</section>${tutor()}</div>`;if(s===4)return `<div class="mission-layout"><section class="panel">${renderExplain(2)}</section>${tutor()}</div>`;if(s===5)return `<div class="mission-layout"><section class="panel badge-panel">${badgeView(2)}</section>${tutor()}</div>`;return `<div class="repair-mode"><button data-action="board-view" data-value="guided" aria-pressed="${UI.boardView==='guided'}">One clue at a time</button><button data-action="board-view" data-value="diagram" aria-pressed="${UI.boardView==='diagram'}">See the full diagram</button><button data-action="board-view" data-value="list" aria-pressed="${UI.boardView==='list'}">Inspection list</button></div>${UI.boardView==='guided'?renderGuidedRepair():renderFullBoard()}`;}

function learnedNotebook(){return S.learn.done.length?`<section class="notebook-section"><h3>Ideas from the demonstrations</h3>${S.learn.done.map(i=>`<div class="notebook-entry"><h3>${LESSONS[i].tag}</h3><p>${LESSONS[i].takeaway}</p></div>`).join('')}</section>`:'';}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,l=S.learn;switch(a){
 case 'learn-start':S.tour.playground=false;startAdventure();break;
 case 'activate-change':S.m1.expanded=true;S.m1.changedSelected='weight';UI.feedback=null;save();render();break;
 case 'changed-next':UI.changedSummary=['weight','clinic'].every(id=>S.m1.changed.includes(id));S.m1.changedSelected=['weight','clinic'].find(id=>!S.m1.changed.includes(id))||'clinic';UI.feedback=null;save();render(true);break;
 case 'confirm-unchanged':{if(!['weight','clinic'].every(id=>S.m1.changed.includes(id)))return;let added=0;LABS.candidates.filter(c=>!['weight','clinic'].includes(c.id)).forEach(c=>{if(!S.m1.changed.includes(c.id))S.m1.changed.push(c.id);const id='change-'+c.id;if(!S.earned.includes(id)){S.earned.push(id);added+=REWARDS[id];}});save();render();if(added)toast('+'+added+' XP · Twelve verdicts checked');announce('All fourteen verdicts reviewed. Two changed, twelve stayed the same.');break;}
 case 'guided-diagnose':{const f=LABS.faults.find(x=>x.id===el.dataset.fault);if(!f||S.m2.fixed.includes(f.id))return;UI.inspect=f.id;const val=Number(el.dataset.value);if(val===f.type){UI.diagnosed=true;UI.feedback=null;render();announce('That diagnosis fits. Now choose the repair.');}else{UI.diagnosed=false;setFeedback(false,'Use this clue',REPAIR_LESSONS[f.id].remember);}break;}
 case 'next-repair':UI.inspect=LABS.faults.find(f=>!S.m2.fixed.includes(f.id))?.id||'f7';UI.diagnosed=false;UI.feedback=null;UI.hint=0;render(true);break;
 }});

function normalizeTour(raw){const t=newTourState();if(!raw||typeof raw!=='object')return t;t.started=raw.started===true;const supplied=Array.isArray(raw.passed)?raw.passed:[];for(const key of TOUR_KEYS){if(!supplied.includes(key))break;t.passed.push(key);}const index=Number.isInteger(raw.chapter)&&raw.chapter>=0&&raw.chapter<3&&Number.isInteger(raw.beat)&&raw.beat>=0&&raw.beat<ADVENTURES[raw.chapter].steps.length?TOUR_KEYS.indexOf(raw.chapter+':'+raw.beat):0;const allowed=Math.min(index,t.passed.length,TOUR_KEYS.length-1);const [c,b]=TOUR_KEYS[allowed].split(':').map(Number);t.chapter=c;t.beat=b;t.playground=raw.playground===true&&t.passed.length===TOUR_KEYS.length;return t;}
function currentBeat(){return ADVENTURES[S.tour.chapter].steps[S.tour.beat];}
function beatPassed(){return S.tour.passed.includes(S.tour.chapter+':'+S.tour.beat);}

function recordsModel(beat,done,animate,override){const phase=override?.phase??beat+(done?1:0);const template=phase>=2,attrs=phase>=3,bella=override?override.records>0:phase>=4,max=override?override.records>1:phase>=5,exam=override?override.examined:phase>=6;return `<div class="record-model"><div class="model-section-title">WHAT THE SYSTEM REMEMBERS</div>${template?`<div class="live-template ${animate&&beat===1?'draw-template':''}"><div class="template-name">${questIcon('box')}<div><small>CLASS · REUSABLE TEMPLATE</small><strong>Pet</strong></div></div>${attrs?`<div class="template-facts ${animate&&beat===2?'facts-incoming':''}"><span>name <i>________</i></span><span>species <i>________</i></span><span>weight <i>________</i></span></div>`:'<div class="blank-lines"><span></span><span></span><span></span></div>'}${exam?'<div class="template-operation">ACTION · beExamined()</div>':''}</div>`:`<div class="record-placeholder">${questIcon('box')}<strong>No template yet.</strong><span>We’ll make one together.</span></div>`}<div class="record-tray">${bella?tourRecord('Bella',exam?13:12,animate&&(beat===3||beat===5)):'<div class="empty-tray">The record tray is empty.</div>'}${max?tourRecord('Max',18,animate&&beat===4):''}</div>${bella?`<div class="model-caption">1 class → ${max?'2 objects':'1 object'}${exam?' · 1 updated value':''}</div>`:''}</div>`;}

function renderAdventure(){const t=S.tour,c=ADVENTURES[t.chapter],b=currentBeat(),passed=beatPassed(),total=TOUR_KEYS.length,complete=t.passed.length===total,animate=A_UI.animate;const last=t.beat===c.steps.length-1;return `<div class="adventure-wrap"><div class="adventure-navigation"><button class="text-button" data-action="home">← My learning path</button><span class="chapter-chip">CHAPTER ${t.chapter+1} / 3 · ${c.name}</span><button class="motion-control" data-action="tour-pause" aria-pressed="${A_UI.paused}">${A_UI.paused?'Resume motion':'Pause motion'}</button></div><div class="tiny-steps" aria-label="Chapter progress">${c.steps.map((_,i)=>`<span class="${t.passed.includes(t.chapter+':'+i)?'done':i===t.beat?'current':''}"></span>`).join('')}</div><section class="pip-instruction" aria-label="Pip’s step-by-step guidance">${questIcon('pip')}<div><div class="eyebrow">PIP’S SMALL STEP ${t.beat+1} OF ${c.steps.length}${passed?' · COMPLETE':''}</div><h1>${b.title}</h1><p>${passed?b.after:b.say}</p></div></section>${renderAdventureScene(t.beat,passed,animate)}<div class="step-result ${passed?'is-visible':''}" role="status">${passed?`${questIcon('spark')}<div><strong>${last?'You understood the idea.':'Step complete.'}</strong><p>${last?'Keep this idea. You are ready for the next part.':'Read Pip’s explanation above. Replay the motion, or continue when you are ready.'}</p></div>`:'<p><strong>Your turn.</strong> '+(b.check!==undefined?'Choose an answer below. A wrong guess gives you a clue.':'Use the green button below. Watch, then read what changed.')+'</p>'}</div>${A_UI.hint&&!A_UI.feedback?`<aside class="baby-hint"><strong>Let’s make it simpler.</strong><p>${b.hint}</p>${A_UI.hint>1?`<p><strong>Do this now:</strong> ${b.check!==undefined?'Choose “'+LESSONS[b.check].choices[LESSONS[b.check].answer]+'.” Then read why it fits.':'Click “'+b.act+'.” Then look at the '+(t.chapter===2?'links and numbers':'record panel')+'.'}</p>`:''}</aside>`:''}${A_UI.feedback?`<div class="feedback retry" role="status"><strong>A useful clue</strong><p>${A_UI.feedback}</p></div>`:''}<div class="adventure-actions"><div class="small-help"><button class="text-button" data-action="tour-hint" ${A_UI.hint>=2&&!A_UI.feedback?'disabled':''}>${A_UI.hint>=2&&!A_UI.feedback?'All help shown':A_UI.hint?'Show me exactly':'I’m not sure'}</button>${passed&&b.check===undefined?'<button class="text-button" data-action="tour-replay">↻ Replay the motion</button>':''}${t.beat||t.chapter?'<button class="text-button" data-action="tour-back">Previous step</button>':''}</div>${passed?`<button class="primary next-step" data-action="tour-next">${complete&&last&&t.chapter===2?'Try the practice playground':last?'Next chapter: '+ADVENTURES[t.chapter+1]?.name:'I see it. Continue'} <span aria-hidden="true">→</span></button>`:b.check!==undefined?`<div class="tour-choices">${LESSONS[b.check].choices.map((x,i)=>`<button data-action="tour-answer" data-value="${i}">${x}</button>`).join('')}</div>`:`<button class="primary do-step" data-action="tour-act"><span class="button-paw" aria-hidden="true">▶</span> ${b.act}</button>`}</div><p class="adventure-footnote">${LESSONS[t.chapter].source} · No timer. No points lost. ${storageOK?'Your place is saved.':'Use Settings to back up before closing.'}</p></div>`;}

function renderWelcome(){const started=S.tour.started,finished=S.tour.passed.length===TOUR_KEYS.length,next=nextLearningAction();return `<div class="welcome-top"><span class="course-chip">UNCG · ISM301</span><span class="small muted">Systems and Process Analysis</span></div><section class="v3-hero"><div class="v3-hero-copy"><span class="eyebrow">YOUR FIRST SYSTEMS ANALYSIS ADVENTURE</span><h1>Come on in.<br>We’ll learn together.</h1><p>Help a little clinic remember its pets and appointments. Pip walks you through every click.</p><div class="start-promise">${questIcon('pip')}<span><strong>One small step at a time.</strong><br>Watch it. Try it. Understand it.</span></div><button class="primary v3-start" data-action="${next.action}" ${next.mission?'data-m="'+next.mission+'"':''}>${next.label} <span aria-hidden="true">→</span></button><span class="next-step-note">${next.detail}</span><span class="start-reassurance">No background needed · No timer · Mistakes are welcome</span></div><div class="v3-hero-world">${sceneClinic('arrival',false,false,0,true)}<div class="floating-record f-one">${questIcon('box')}<span><small>ONE TEMPLATE</small><strong>Pet</strong></span></div><div class="floating-record f-two">${questIcon('dog')}<span><small>ONE RECORD</small><strong>Bella</strong></span></div><button class="motion-control hero-motion" data-action="tour-pause" aria-pressed="${A_UI.paused}">${A_UI.paused?'Resume motion':'Pause motion'}</button></div></section><section class="why-play"><div><span class="eyebrow">WHY THIS BELONGS IN YOUR CLASS</span><h2>Turn the clinic’s story<br>into a clear model.</h2></div><p>In <strong>UNCG — ISM301: Systems and Process Analysis</strong>, you learn to understand a business before building its software. This game practices <strong>Chapter 5: Structural Modeling</strong>. You will discover what needs a record and how those records connect.</p></section><div class="simple-path" aria-label="Your guided learning path"><div><span>1</span><strong>Learn with Pip</strong><p>Build records and watch what changes.</p></div><div><span>2</span><strong>Try the playground</strong><p>Replay the ideas at your own pace.</p></div><div><span>3</span><strong>Solve the clinic case</strong><p>Choose classes and repair a diagram.</p></div></div>${started||S.m1.solved.length||S.m2.fixed.length?learningProgressHTML():''}<details class="experienced-path"><summary>${S.m1.solved.length||S.m2.fixed.length?'My missions and saved progress':'Already familiar with the basics? Open a mission'}</summary><p>The guided adventure is the best place to begin. These are the original class exercises.</p><div class="button-row"><button data-action="tour-start">${started?'Review with Pip':'Learn with Pip'}</button><button data-action="mission" data-m="1">Find the classes · ${S.m1.solved.length}/14</button><button data-action="mission" data-m="2">Repair the diagram · ${S.m2.fixed.length}/7</button>${finished?'<button data-action="tour-play">Open the playground</button>':''}</div><p class="small">${xp()} XP · ${Number(S.m1.badge)+Number(S.m2.badge)} badges collected</p><button data-action="learning-recap">See my learning recap</button></details><p class="saved-progress-note" data-save-status>${storageOK?'Progress is saved in this browser.':'Saving is unavailable. Back up your progress before closing.'}</p>`;}

function notebookText(){let t='# Class Quest — Field Notebook\n\nUNCG — ISM301: Systems and Process Analysis\n\nGuided adventure: '+S.tour.passed.length+'/19 steps | Chapter checks: '+S.learn.done.length+'/3\n\n'+xp()+' XP | '+(Number(S.m1.badge)+Number(S.m2.badge))+'/2 badges\n\n## Personal notes\n\n'+(S.notes||'(No personal notes yet.)')+'\n\n## Ideas from the demonstrations\n'+(S.learn.done.map(i=>'\n- '+LESSONS[i].takeaway).join('')||'\n(No demonstration checks completed yet.)')+'\n\n## Class interviews\n';for(const c of LABS.candidates.filter(c=>S.earned.includes('class-'+c.id))){t+='\n### '+c.name+' — '+(c.keep?'Class':'Leave out')+'\n\n'+c.why+'\n';if(c.keep)t+='\nKnows: '+c.know+'\n\nCan do: '+c.do+'\n\nExample collaborators: '+c.collab+'.\n';}for(const id of ['clinic','weight'])if(S.earned.includes('change-'+id))t+='\n### New requirements: '+LABS.candidates.find(c=>c.id===id).name+'\n\n'+LABS.candidates.find(c=>c.id===id).changedWhy+'\n';t+='\n## Diagram repairs\n';for(const f of LABS.faults)if(S.earned.includes(f.id))t+='\n### '+f.target+'\n\n'+MATH[f.id]+'\n';if(S.earned.includes('joint'))t+='\n### Joint ownership\n\n'+MATH.joint+'\n';if(S.bonus)t+='\n### Compartment bonus\n\n'+MATH.bonus+'\n';t+='\n## Explain an idea in your own words\n\nThese optional prompts are for reflection, not additional scored questions.\n\n'+REFLECTION_PROMPTS.map(q=>'- '+q).join('\n')+'\n';return t+'\n## Sources\n\nISM301_Module_Request_Structural_Modeling.docx; ISM301_Ch5_Handout.pptx (33 slides).\n\nThe repair board is the supplied excerpt, not a complete production model. The instructor key supplies the multiplicities.\n';}
function beginReplay(m){UI.pendingReplay=m;openDialog('Replay Mission '+m,`<p>This reopens the same case and resets the current mission’s steps. Your earned XP, badges, and collected notebook discoveries stay available. Repeated clues do not earn extra XP.</p><div class="button-row"><button class="primary" data-action="confirm-replay">Replay this mission</button><button data-action="close">Keep my current place</button></div>`);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-candidate],[data-inspect]');if(!el||el.disabled)return;if(el.dataset.candidate){selectCandidate(el.dataset.candidate);return;}if(el.dataset.inspect){selectInspect(el.dataset.inspect);return;}const a=el.dataset.action,v=el.dataset.value,m=Number(el.dataset.m||S.mission);switch(a){
 case 'home':S.learn.active=false;S.mission=0;resetUI();save();render(true);break;
 case 'mission':S.learn.active=false;S.mission=m;resetUI();save();render(true);break;
 case 'briefing':showBriefing();break;
 case 'guide':showGuide(el.dataset.tab||'basics');break;
 case 'guide-tab':showGuide(el.dataset.tab);break;
 case 'notebook':showNotebook();break;
 case 'settings':showSettings();break;
 case 'close':closeDialog();break;
 case 'hint':UI.hint=Math.min(3,UI.hint+1);render();announce(tutorHints(S.mission,S['m'+S.mission].step)[UI.hint-1]);break;
 case 'ask':{if(S.m1.step===3)return;const c=currentCandidate(),bit=1<<Number(el.dataset.q);S.m1.asked[c.id]=(S.m1.asked[c.id]||0)|1|bit;save();render();announce([c.who,c.know,c.do][Number(el.dataset.q)]);break;}
 case 'verdict':answerVerdict(v==='1');break;
 case 'reuse':answerVerdict(currentCandidate().keep);break;
 case 'round':{selectCandidate(LABS.candidates[Number(v)*7].id);break;}
 case 'next-candidate':{const changed=S.m1.step===3,arr=changed?S.m1.changed:S.m1.solved,c=currentCandidate(),start=LABS.candidates.indexOf(c);for(let k=1;k<=14;k++){const next=LABS.candidates[(start+k)%14];if(!arr.includes(next.id)){selectCandidate(next.id);break;}}break;}
 case 'guess-pick':UI.guessDraft=Number(v);render();break;
 case 'guess-check':{const guess=UI.guessDraft??S['m'+S.mission].guess;if(guess===null)return;S['m'+S.mission].guess=guess;reward('guess'+S.mission);render();announce('The original total is seven. Continue to investigate the evidence.');break;}
 case 'explain-answer':{const q=LABS.explain[S.mission],i=Number(v);UI.explainDraft=i;if(i===q.answer){S['m'+S.mission].explain=true;UI.feedback=null;reward('explain'+S.mission);render();announce(q.feedback[i]);}else setFeedback(false,'Think about the requirement',q.feedback[i]);break;}
 case 'next':{const q=S['m'+S.mission];if(!gate(S,S.mission,q.step))return;q.step=Math.min(5,q.step+1);if(S.mission===1&&q.step===2)q.selected=LABS.candidates.find(c=>!q.solved.includes(c.id))?.id||'pet';resetUI();save();render(true);break;}
 case 'back':{const q=S['m'+S.mission];if(q.step===0)S.mission=0;else q.step--;resetUI();save();render(true);break;}
 case 'claim':{const q=S['m'+m];if(q.step!==5||!q.explain)return;q.badge=true;reward('badge'+m);render();celebrate();announce(GUIDE.missions[m].badge+' badge earned.');break;}
 case 'board-view':UI.boardView=v;UI.feedback=null;UI.diagnosed=false;if(v==='guided')UI.inspect=faultFor(UI.inspect)||LABS.faults.find(f=>!S.m2.fixed.includes(f.id))?.id||'f7';render();break;
 case 'diagnose':{if(UI.diagnosis==='')return;const fid=faultFor(UI.inspect),f=LABS.faults.find(x=>x.id===fid),i=Number(UI.diagnosis);if(f&&i===f.type){UI.diagnosed=true;UI.feedback=null;render();announce('Diagnosis matched. Now choose the correction.');}else if(!f&&i===7)setFeedback(true,'This element is correct',boardReason(UI.inspect));else if(!f)setFeedback(false,'Keep this element',boardReason(UI.inspect));else setFeedback(false,'Look at what this element claims',i===7?'This target contains a fault. '+MATH[f.id]:'The supplied diagnosis is “'+LABS.types[f.type]+'.” '+MATH[f.id]);break;}
 case 'repair':{const f=LABS.faults.find(x=>x.id===faultFor(UI.inspect));if(!f||!UI.diagnosed||S.m2.fixed.includes(f.id))return;if(Number(v)===f.answer){S.m2.fixed.push(f.id);UI.repairMotion=f.id;UI.feedback=null;UI.diagnosed=false;reward(f.id);render();announce('Repair complete. '+MATH[f.id]);}else setFeedback(false,'That repair changes the wrong claim',f.wrong[Number(v)]);break;}
 case 'joint-check':if(UI.jointDraft==='1..*'){S.m2.joint=true;UI.feedback=null;reward('joint');render();announce(MATH.joint);}else setFeedback(false,'Read from one Pet toward Owner',UI.jointDraft==='1'?'Exactly one would still forbid joint ownership. The new rule allows several owners.':'Zero would allow a registered pet with no owner. The changed rule still requires at least one. Use one or more.');break;
 case 'bonus':showBonus();break;
 case 'bonus-answer':if(v==='1'){S.bonus=true;reward('bonus');showBonus();announce(MATH.bonus);}else{document.getElementById('bonus-feedback').innerHTML=`<div class="feedback retry"><strong>Try the action test</strong><p>${v==='0'?'An attribute is a remembered fact. recordTreatment() is something the class does.':'This is an action of Treatment, so it belongs inside that class.'}</p></div>`;announce('Try the action test. recordTreatment() is an operation.');}break;
 case 'export-notebook':download('Class_Quest_Notebook.md',notebookText(),'text/markdown;charset=utf-8');toast('Notebook download prepared');break;
 case 'export-progress':download('Class_Quest_Progress.json',JSON.stringify(S,null,2),'application/json');toast('Progress backup prepared');break;
 case 'import-progress':document.getElementById('restore-input').click();break;
 case 'confirm-import':if(UI.pendingImport){S=UI.pendingImport;UI.pendingImport=null;closeDialog();resetUI();save();render(true);toast('Progress restored');}break;
 case 'replay':beginReplay(m);break;
 case 'confirm-replay':{const which=UI.pendingReplay;if(![1,2].includes(which))return;const badge=S['m'+which].badge;S['m'+which]=initialState()['m'+which];S['m'+which].badge=badge;S.mission=which;S.learn.active=false;closeDialog();resetUI();save();render(true);toast('Practice replay opened');break;}
 case 'reset':openDialog('Reset all progress?',`<p>This clears both missions, XP, badges, and your notebook from this browser. Download a backup first if you want to keep them.</p><div class="button-row"><button data-action="export-progress">Back up first</button><button class="danger" data-action="confirm-reset">Reset everything</button><button data-action="close">Cancel</button></div>`);break;
 case 'confirm-reset':S=initialState();closeDialog();resetUI();save();render(true);toast('A fresh case is ready');break;
 }});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='expanded-rule'){S.m1.expanded=el.checked;UI.feedback=null;save();render();announce(el.checked?'New requirements active. Review each original verdict.':'Original requirements shown. Turn on the new requirements to continue.');}if(el.id==='fault-type'){UI.diagnosis=el.value;UI.feedback=null;render();}if(el.id==='owner-multiplicity'){UI.jointDraft=el.value;UI.feedback=null;render();}if(el.id==='sound-setting'){S.sound=el.checked;save();if(S.sound)playSound(false);}if(el.id==='motion-setting'){S.reduced=el.checked;save();}});
document.addEventListener('input',e=>{if(e.target.id==='personal-notes'){S.notes=e.target.value.slice(0,12000);save();const status=document.getElementById('note-save-status');if(status)status.textContent=storageOK?'Notes saved in this browser.':'Saving unavailable. Download your notebook before closing.';}});
document.getElementById('restore-input').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100000){stageBackup(' '.repeat(100001));return;}stageBackup(await file.text());}catch(_){UI.pendingImport=null;openDialog('The backup could not be read','<p>Your current progress has not changed. Try Settings → Paste a backup, then paste the full text from your .json backup.</p><button data-action="paste-backup">Paste a backup</button>');}finally{e.target.value='';}});
document.addEventListener('keydown',e=>{const target=e.target;if(target.matches('svg [role="button"], svg [role="button"] *')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();selectInspect(target.closest('[data-inspect]').dataset.inspect);}if(target.dataset.candidate&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){const cards=[...document.querySelectorAll('[data-candidate]')],i=cards.indexOf(target);e.preventDefault();const j=e.key==='Home'?0:e.key==='End'?cards.length-1:(i+(['ArrowLeft','ArrowUp'].includes(e.key)?cards.length-1:1))%cards.length;cards[j].focus();}if(e.key==='Escape'&&!document.getElementById('dialog').open&&UI.inspect){UI.inspect=null;UI.diagnosed=false;UI.feedback=null;render();}});
document.getElementById('dialog').addEventListener('close',()=>{if(UI.focusReturn?.isConnected)UI.focusReturn.focus({preventScroll:true});});
try{localStorage.setItem(SAVE_KEY+'-probe','1');localStorage.removeItem(SAVE_KEY+'-probe');}catch(_){storageOK=false;}
render();if(loadWarning)toast(loadWarning);

</script>
